<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="estilos/geral.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>

            <div id="formulario">
                <h1>Login</h1>
                
                <p>Seja Bem vindo(a). Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

                <form action="login.php" method="post">
                    <p id="usu-g"> 
                        <label for="usu">
                            <i class="material-symbols-outlined" id="usu-icon">
                                account_circle
                            </i>
                        </label>
                        <input type="text" name="usuario" id="usu" required maxlength="20" placeholder="Usuário">
                    </p>
                    <p id="senh-g">
                        <label for="senh">
                            <i class="material-symbols-outlined" id="senh-icon">
                                key
                            </i>
                        </label>
                        <input type="text" name="senha" id="senh" required maxlength="20" minlength="6" placeholder="Senha">
                    </p>

                        <p id="entrar">
                            <input type="button" value="Entrar" id="botao-entrar">
                        </p>
                        <p id="esqueci">
                            <input type="button" value="Esqueci a senha" id="botao-esqueci">
                        </p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
