<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="estilosprof/geral.css">
    <link rel="stylesheet" href="estilosprof/mediaquery.css">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main> 

        <section id="login">
            <div id="imagem">
            </div>

            <div id="formulario">
                <h1>Login</h1>
                
                <p>Seja Bem vindo(a). Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

                <form action="login.php" method="post">
                    <div class="campo">
                        <label for="ilogin"><i class="material-symbols-outlined">person</i></label>

                        <input type="email" name="login" id="ilogin" placeholder="Seu email" autocomplete="email" required maxlength="30">
                    </div>

                    <div class="campo">
                        <label for="isenha"><i class="material-symbols-outlined">key</i></label>

                        <input type="password" name="senha" id="isenha" placeholder="Sua senha" autocomplete="current-password" required minlength="6" maxlength="20">
                    </div>

                    <input type="submit" value="Entrar">
                    <input type="button" value="Esqueci a senha">


                </form>
            </div>
        </section>
    </main>
</body>
</html>
