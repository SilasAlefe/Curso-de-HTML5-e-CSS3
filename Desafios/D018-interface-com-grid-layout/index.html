<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }
        body{
            height: 100vh;
            width: 100vw;

            display: grid;
            grid-template-rows: 2fr 1fr 4fr 1fr;
            grid-template-columns: repeat(3, 3fr);
            gap: 5px; 

            background-color: lightgray;

            text-align: center;
        }

        #it1{
            grid-area: 1 / 1 / 2 / 4;
            background-color: white;
            border: 1px solid black;
            padding: 15px;
        }

        #it2{
            grid-area: 2 / 1 / 3 / 4;
            background-color: white;
            border: 1px solid black;
            padding: 15px;
        }

        #it3{
            grid-area: 3 / 1 / 4 / 3;
            background-color: white;
            border: 1px solid black;
            padding: 15px;
        }

        #it4{
            grid-area: 3 / 3 / 4 / 4;
            background-color: white;
            border: 1px solid black;
            padding: 15px;
        }

        #it5{
            grid-area: 4 / 1 / 5 / 4;
            background-color: white;
            border: 1px solid black;
            padding: 15px;
        }

    </style>
</head>
<body>
    <header id="it1">
        <h1>Topo</h1>
    </header>

    <nav id="it2">Menu</nav>

    <main id="it3">Principal</main>

    <aside id="it4">Secundario</aside>

    <footer id="it5">Rodapé</footer>
</body>
</html>
