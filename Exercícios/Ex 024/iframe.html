<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>

    <!--Tamanho padrão do iframe 300x150-->

    <p>
        Acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com" scrolling="auto">
            <p><a href="https://www.cursoemvideo.com"></a></p> <!--Só aparece isso aqui se o iframe for incompatível-->
            
        </iframe> 
        
        para aprender a programar.
    </p>

    <p>O site do <iframe src="https://www.google.com.br""></iframe> também é muito legal, pena que não funciona dentro do iframe!</p>

    <p>
        O repositório do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" width="100%" height="100%" scrolling="auto">
            <p><a href="https://www.cursoemvideo.com"></a></p> <!--Só aparece isso aqui se o iframe for incompatível-->
        </iframe>

        também é bem legal
    </p>
</body>
</html>
