<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-color: antiquewhite;
        }
    </style>
</head>
<body>
    <a href="#" id="clique">Clique em mim</a>
    <div id="saida"></div>

    <script>
        var c = window.document.getElementById("clique")
        c.addEventListener('click', link)

        function link(){
            var s = window.document.getElementById('saida')
            s.innerHTML += '<p>Você clicou</p>'
        }

    </script>
</body>
</html>
